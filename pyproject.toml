[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasscomot"
version = "1.0.0"
description = "Quantum-Safe Cryptography for Automotive Systems"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "Proprietary"}
authors = [
    {name = "LTTS Quantum Security Team", email = "quantum-security@ltts.com"}
]
keywords = [
    "post-quantum",
    "cryptography",
    "automotive",
    "V2X",
    "AUTOSAR",
    "ISO-21434"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/CYBERSQRP/NASSCOMOT"
Documentation = "https://nasscomot.readthedocs.io/"
Repository = "https://github.com/CYBERSQRP/NASSCOMOT"
Issues = "https://github.com/CYBERSQRP/NASSCOMOT/issues"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "liboqs.*",
    "scapy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=modules",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as benchmarks",
    "hardware: marks tests requiring hardware (HSM, TPM, etc.)",
    "qkd: marks tests for QKD simulation",
    "pqc: marks tests for PQC algorithms",
    "v2x: marks tests for V2X communication",
    "autosar: marks tests for AUTOSAR integration",
]

[tool.coverage.run]
source = ["modules"]
omit = [
    "*/tests/*",
    "*/benchmarks/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0330",  # Wrong hanging indentation before block
    "C0326",  # Bad whitespace
    "W0511",  # TODO/FIXME warnings
]

[tool.bandit]
exclude_dirs = ["/tests", "/benchmarks"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]
